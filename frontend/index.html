<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link href="styles.css" rel="stylesheet" />
  </head>

  <body>
    <section id="header">
      <h3>My Todo App</h3>
      <div class="profile-container">
        <span class="profile-name">Benedict Amoako</span>
        <img class="profile-icon" src="images/user.png" alt="Profile Icon" />
      </div>
    </section>
    <div class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Add New Todo</h2>
        <form id="add-todo-form">
          <input type="text" id="todo-input" placeholder="Enter title" required />
          <input type="text" id="todo-description" placeholder="Enter todo description" required />
          <button type="submit">Add Todo</button>
          <input title="status" name="status" type="checkbox" id="check-box">
        </form>
      </div>
    </div>
    <section id="todo-container"></section>
    <section id="add-todo">
      <div>Add new todo item</div>
      <img class="plus-icon" src="images/plus.png" alt="Add todo" />
    </section>
    <script src="script.js"></script>
  </body>
</html>
